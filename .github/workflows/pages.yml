# Serves the VPM listing (vpm/index.json) at https://hhvrc.github.io/dreadscripts-unlocked/index.json,
# the URL users add to the Creator Companion. Only the listing is published; the package zips it
# points at are release assets.
#
# publish.yml calls this after it commits a new version to the listing. That commit is pushed with
# GITHUB_TOKEN, which never triggers the push trigger below, so the call is what deploys it.
name: Deploy VPM listing

on:
  push:
    branches: [main]
    paths: [vpm/index.json, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # main, not the triggering ref: when publish.yml calls this from a tag, the tag predates the
      # listing commit that lists it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Stage site
        run: |
          mkdir _site
          cp vpm/index.json _site/index.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
